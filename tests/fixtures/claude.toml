# Claude Code instance: weekends only, up to 90% of the weekly quota. See README.
[instance]
name = "claude"

[engine]
kind = "claude"

[schedule]
start = "fri 19:00"
end = "sun 03:00"
# No new unit starts in these last minutes (it would be cut right away).
start_margin_minutes = 15

[defaults]
orchestrator_model = "claude-opus-5-5"
orchestrator_effort = "medium"
# Cap of the Fable quota, in %: above it the planner and plan-reviewer use Opus until the reset,
# so some Fable is left for you. A unit with planning can spend up to 15 points.
fable_cap = 80
safety_factor = 1.5
primary_cap = 100
initial_cost_primary = 8.0
initial_cost_secondary = 1.5
blocked_cooldown_hours = 6

[notify]
# The topic comes from secrets.toml, the same one the Codex instance uses.
server = "https://ntfy.sh"
decision_timeout_hours = 4

[[project]]
name = "my-app"
path = "/home/me/projects/my-app"
weekly_cap = 90
docker_group = "web"

[[project]]
name = "my-api"
path = "/home/me/projects/my-api"
weekly_cap = 90

[[project]]
name = "side-project"
path = "/home/me/projects/side-project"
weekly_cap = 90
docker_group = "web"
